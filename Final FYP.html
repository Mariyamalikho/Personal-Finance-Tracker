<html><head><base href="." target="_blank">
    <meta charset="UTF-8">
    <title>Personal Finance Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6B5B95;
            --secondary: #fff;
            --accent: #F8B195;
            --background: #F6F5FF;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--background);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #8675A9);
            color: var(--secondary);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(107, 91, 149, 0.2);
            position: relative;
        }

        .input-section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #E8E8E8;
            border-radius: 8px;
            background-color: #FAFAFA;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(107, 91, 149, 0.2);
        }

        button {
            background: linear-gradient(135deg, var(--primary), #8675A9);
            color: var(--secondary);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 91, 149, 0.3);
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .chart-wrapper {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .insights-section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .insight-card {
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 15px;
            background-color: #F8F7FF;
            border-radius: 0 8px 8px 0;
            transition: transform 0.2s;
        }

        .insight-card:hover {
            transform: translateX(5px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .summary-card {
            background: linear-gradient(135deg, #F8F7FF, #F0EEFF);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(107, 91, 149, 0.2);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .login-header {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form input {
            margin-bottom: 10px;
        }

        .login-error {
            color: #ff4444;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .signup-container {
            display: none; /* Hidden by default */
        }

        .toggle-form {
            color: var(--primary);
            text-decoration: underline;
            cursor: pointer;
            text-align: center;
            margin-top: 15px;
        }

        .form-title {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-container">
            <!-- Login Form -->
            <div id="loginContainer">
                <div class="login-header">
                    <h2>Personal Finance Tracker</h2>
                    <p>Login to manage your finances</p>
                </div>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit">Login</button>
                    <div id="loginError" class="login-error"></div>
                </form>
                <div class="toggle-form" id="showSignup">
                    Don&apos;t have an account? Sign up
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupContainer" style="display: none;">
                <div class="login-header">
                    <h2>Personal Finance Tracker</h2>
                    <p>Create your account</p>
                </div>
                <form id="signupForm" class="login-form">
                    <div class="form-group">
                        <label for="signupUsername">Username</label>
                        <input type="text" id="signupUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit">Sign Up</button>
                    <div id="signupError" class="login-error"></div>
                </form>
                <div class="toggle-form" id="showLogin">
                    Already have an account? Login
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>Personal Finance Tracker</h1>
            <p>Smart financial planning for your future</p>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>

        <div class="input-section">
            <h2>Add New Transaction</h2>
            <form id="expenseForm" class="grid-form">
                <div class="form-group">
                    <label for="transactionType">Transaction Type</label>
                    <select id="transactionType" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (PKR)</label>
                    <input type="number" id="amount" required min="0">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="income">Income</option>
                        <option value="food">Food</option>
                        <option value="utilities">Utilities</option>
                        <option value="transportation">Transportation</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="rent">Rent</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <button type="submit">Add Transaction</button>
                </div>
            </form>
        </div>

        <div class="summary-card">
            <h3>Monthly Summary</h3>
            <div id="summary"></div>
        </div>

        <div class="charts-container">
            <div class="chart-wrapper">
                <canvas id="expenseChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="insights-section">
            <h2>Smart Insights</h2>
            <div id="insights"></div>
        </div>
    </div>

    <script>let currentUser = null;
let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
const expenseCtx = document.getElementById('expenseChart').getContext('2d');
const trendCtx = document.getElementById('trendChart').getContext('2d');
const expenseChart = new Chart(expenseCtx, {
  type: 'bar',
  data: {
    labels: ['Income', 'Food', 'Utilities', 'Transportation', 'Entertainment', 'Rent', 'Other'],
    datasets: [{
      label: 'Monthly Breakdown (PKR)',
      data: [0, 0, 0, 0, 0, 0, 0],
      backgroundColor: ['#B8A9C6', '#F8B195', '#96CEB4', '#D4A5A5', '#FFE0E0', '#A5BBD4', '#E0E0FF']
    }]
  },
  options: {
    responsive: true,
    plugins: {
      title: {
        display: true,
        text: 'Monthly Financial Breakdown'
      }
    }
  }
});
const trendChart = new Chart(trendCtx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: 'Daily Transaction Trend (PKR)',
      data: [],
      borderColor: '#6B5B95',
      tension: 0.3,
      fill: true,
      backgroundColor: 'rgba(107, 91, 149, 0.1)'
    }]
  },
  options: {
    responsive: true,
    plugins: {
      title: {
        display: true,
        text: 'Transaction Trend'
      }
    }
  }
});
function handleLogin(username, password) {
  const users = JSON.parse(localStorage.getItem('users')) || [];
  const user = users.find(u => u.username === username && u.password === password);
  if (user) {
    currentUser = username;
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginOverlay').style.display = 'none';
    transactions = JSON.parse(localStorage.getItem(`transactions_${username}`)) || [];
    updateCharts();
    updateSummary();
    generateInsights();
  } else {
    document.getElementById('loginError').textContent = 'Invalid username or password';
  }
}
function handleSignup(username, password) {
  const users = JSON.parse(localStorage.getItem('users')) || [];
  if (users.some(u => u.username === username)) {
    document.getElementById('signupError').textContent = 'Username already exists';
    return;
  }
  users.push({
    username,
    password
  });
  localStorage.setItem('users', JSON.stringify(users));
  document.getElementById('loginContainer').style.display = 'block';
  document.getElementById('signupContainer').style.display = 'none';
  document.getElementById('loginUsername').value = username;
  document.getElementById('loginPassword').value = password;
}
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  handleLogin(username, password);
});
document.getElementById('showSignup').addEventListener('click', function () {
  document.getElementById('loginContainer').style.display = 'none';
  document.getElementById('signupContainer').style.display = 'block';
});
document.getElementById('showLogin').addEventListener('click', function () {
  document.getElementById('loginContainer').style.display = 'block';
  document.getElementById('signupContainer').style.display = 'none';
});
document.getElementById('signupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const username = document.getElementById('signupUsername').value;
  const password = document.getElementById('signupPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (password !== confirmPassword) {
    document.getElementById('signupError').textContent = 'Passwords do not match';
    return;
  }
  if (password.length < 6) {
    document.getElementById('signupError').textContent = 'Password must be at least 6 characters long';
    return;
  }
  const users = JSON.parse(localStorage.getItem('users')) || [];
  if (users.some(u => u.username === username)) {
    document.getElementById('signupError').textContent = 'Username already exists';
    return;
  }
  users.push({
    username,
    password
  });
  localStorage.setItem('users', JSON.stringify(users));
  currentUser = username;
  document.getElementById('loginOverlay').style.display = 'none';
  transactions = [];
  updateCharts();
  updateSummary();
  generateInsights();
});
document.getElementById('expenseForm').addEventListener('submit', function (e) {
  e.preventDefault();
  if (!currentUser) return;
  const transaction = {
    type: document.getElementById('transactionType').value,
    amount: parseFloat(document.getElementById('amount').value),
    category: document.getElementById('category').value,
    date: document.getElementById('date').value
  };
  transactions.push(transaction);
  localStorage.setItem(`transactions_${currentUser}`, JSON.stringify(transactions));
  updateCharts();
  updateSummary();
  generateInsights();
  this.reset();
});
function updateCharts() {
  const categoryTotals = {
    income: 0,
    food: 0,
    utilities: 0,
    transportation: 0,
    entertainment: 0,
    rent: 0,
    other: 0
  };
  transactions.forEach(t => {
    if (t.type === 'income') {
      categoryTotals.income += t.amount;
    } else {
      categoryTotals[t.category] += t.amount;
    }
  });
  expenseChart.data.datasets[0].data = Object.values(categoryTotals);
  expenseChart.update();
  const sortedTransactions = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
  trendChart.data.labels = sortedTransactions.map(t => t.date);
  trendChart.data.datasets[0].data = sortedTransactions.map(t => t.type === 'income' ? t.amount : -t.amount);
  trendChart.update();
}
function updateSummary() {
  const summary = document.getElementById('summary');
  const totalIncome = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
  const totalExpenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
  summary.innerHTML = `
                <p>Total Income: PKR ${totalIncome.toLocaleString()}</p>
                <p>Total Expenses: PKR ${totalExpenses.toLocaleString()}</p>
                <p>Net Balance: PKR ${(totalIncome - totalExpenses).toLocaleString()}</p>
            `;
}
function generateInsights() {
  const insightsDiv = document.getElementById('insights');
  insightsDiv.innerHTML = '';
  const totalIncome = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
  const totalExpenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
  const categories = ['food', 'utilities', 'transportation', 'entertainment', 'rent', 'other'];
  const categoryTotals = categories.reduce((acc, category) => {
    acc[category] = transactions.filter(t => t.category === category).reduce((sum, t) => sum + t.amount, 0);
    return acc;
  }, {});
  const highestExpenseCategory = Object.entries(categoryTotals).reduce((a, b) => a[1] > b[1] ? a : b);
  const insights = [`Monthly Income: PKR ${totalIncome.toLocaleString()}`, `Total Expenses: PKR ${totalExpenses.toLocaleString()}`, `Highest spending category is ${highestExpenseCategory[0]} at PKR ${highestExpenseCategory[1].toLocaleString()}`, `Your savings rate is ${totalIncome ? ((totalIncome - totalExpenses) / totalIncome * 100).toFixed(1) : 0}%`, totalExpenses > totalIncome * 0.8 ? 'Warning: Your expenses are over 80% of your income' : 'Your spending is within healthy limits'];
  insights.forEach(insight => {
    const insightCard = document.createElement('div');
    insightCard.className = 'insight-card animate-in';
    insightCard.textContent = insight;
    insightsDiv.appendChild(insightCard);
  });
}
function handleLogout() {
  currentUser = null;
  transactions = [];
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
}
document.getElementById('logoutBtn').addEventListener('click', handleLogout);
updateCharts();
updateSummary();
generateInsights();</script>
</body></html>
